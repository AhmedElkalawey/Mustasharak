<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الحجز | Vibecoding</title>
    
    <!-- استدعاء خط Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- استدعاء Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                }
            }
        }
    </script>
    
    <!-- ربط ملف الـ CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#0B1120] text-white min-h-screen flex items-center justify-center relative overflow-hidden font-cairo p-6 selection:bg-indigo-500 selection:text-white">

    <!-- خلفيات متوهجة (Ambient Glow) -->
    <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-indigo-600/20 blur-[150px] pointer-events-none"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-purple-600/20 blur-[150px] pointer-events-none"></div>
    <div class="absolute top-[40%] left-[50%] translate-x-[-50%] w-[30%] h-[30%] rounded-full bg-cyan-600/10 blur-[120px] pointer-events-none"></div>

    <!-- المحتوى الرئيسي -->
    <main class="relative z-10 w-full max-w-md mx-auto">
        
        <!-- زر العودة -->
        <div class="mb-6">
            <a href="index.html" class="inline-flex items-center gap-2 text-slate-400 hover:text-white transition-colors text-sm font-bold bg-white/5 hover:bg-white/10 px-4 py-2 rounded-xl border border-white/5 w-fit">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                العودة للقائمة
            </a>
        </div>

        <!-- شاشة التحميل والأخطاء -->
        <div id="loading" class="text-center text-lg font-bold animate-pulse text-indigo-400 mb-6">
            جاري التحقق من الموعد...
        </div>
        <div id="error-message" class="hidden text-center text-red-400 font-bold text-lg mb-6"></div>
        
        <!-- قسم الحجز -->
        <div id="booking-section" class="hidden bg-white/5 backdrop-blur-xl border border-white/10 rounded-[2rem] p-8 shadow-[0_0_50px_-12px_rgba(139,92,246,0.3)] transition-all duration-500">
            
            <div class="text-center mb-8">
                <h2 class="text-2xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">
                    تأكيد الحجز
                </h2>
                <p id="slot-time-display" class="text-slate-400 text-sm font-medium"></p>
            </div>

            <form id="booking-form" class="space-y-5">
                <input type="hidden" id="slot-id" name="slotId">
                
                <div>
                    <label for="name" class="block text-sm font-bold text-slate-300 mb-2">الاسم الكامل</label>
                    <input type="text" id="name" name="name" required 
                           class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-sm" 
                           placeholder="أدخل اسمك الكريم هنا">
                </div>
                
                <div>
                    <label for="email" class="block text-sm font-bold text-slate-300 mb-2">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" required dir="ltr" 
                           class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-sm text-left" 
                           placeholder="name@example.com">
                </div>

                <button type="submit" id="submit-btn" 
                        class="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold text-base transition-all duration-300 hover:from-indigo-500 hover:to-purple-500 hover:shadow-lg hover:shadow-indigo-500/30 active:scale-95 flex items-center justify-center mt-2">
                    تأكيد الحجز
                </button>
            </form>
            
            <div id="form-feedback" class="hidden mt-6 text-center text-sm font-bold"></div>
        </div>
    </main>

    <!-- ⚠️ السكربتات بالترتيب الصحيح (مهم جداً) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="api.js"></script>
    <script src="booking.js"></script>
</body>
</html>
